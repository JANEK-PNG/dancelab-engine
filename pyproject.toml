[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancelab-engine"
version = "0.1.0"
description = "DanceLab Engine v0 — universal analytical engine for electronic music and DJ decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DanceLab" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy audio/DSP stack is optional so the skeleton installs and tests fast.
# Feature extraction modules import these lazily and fail with a clear message.
audio = [
    "librosa>=0.10",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
]
viz = ["matplotlib>=3.9", "plotly>=5.22"]
desktop = ["PySide6>=6.7"]
desktop-build = [
    "PySide6>=6.7",
    "Nuitka>=4.0",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]
# Real vocal separation (htdemucs). Heavy: pulls torch + ~80 MB model download.
# Optional — vocal_activity falls back to the HPSS proxy without it.
vocals = ["demucs>=4.0", "torch>=2.0"]
# Full stem-aware layer (vocals, bass, drums, other/accompaniment).
stems = ["demucs>=4.0", "torch>=2.0"]
dev = ["pytest>=8.2", "httpx2>=0.28", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
dancelab = "dancelab.cli.analyze:app"
dancelab-host = "dancelab.host.desktop_app:main"
dancelab-host-build = "dancelab.host.desktop_bundle:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dancelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ENV-1: macOS provenance keeps hiding the editable .pth (site.py skips hidden
# .pth files), breaking `import dancelab`. This makes the suite independent of
# that whole failure family — pytest injects src/ itself.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyside6-project]
files = [
    "scripts/dancelab_host_app.py",
    "src/dancelab/contracts/node_host.py",
    "src/dancelab/host/__init__.py",
    "src/dancelab/host/desktop_app.py",
    "src/dancelab/host/desktop_bundle.py",
    "src/dancelab/host/runtime.py",
]
