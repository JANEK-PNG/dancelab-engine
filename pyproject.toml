[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancelab-engine"
version = "0.1.1"
description = "DanceLab Engine v0 — universal analytical engine for electronic music and DJ decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Source-available, non-commercial; all rights reserved. See LICENSE." }
authors = [{ name = "Jan Trybus" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
# Heavy audio/DSP stack is optional so the skeleton installs and tests fast.
# Feature extraction modules import these lazily and fail with a clear message.
audio = [
    "mutagen>=1.47",
    "rich-pixels>=3.0",
    "textual-image>=0.6",
    "librosa>=0.10",
    "numba>=0.63,<0.67",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
]
# The terminal application. Textual itself was never declared — only
# `textual-image` — so a clean clone installed exactly as the README says and
# then died on `dancelab tui` with ModuleNotFoundError. It worked on the
# author's machine only because textual had been installed there by hand.
tui = [
    "textual>=8.2,<9",
    "rich-pixels>=3.0",
    "textual-image>=0.6",
]
# Direct Rekordbox cue writing is optional, but must be explicitly installed.
# Keeping it separate avoids pulling SQLCipher into analysis-only deployments.
rekordbox = ["pyrekordbox>=0.4.4,<0.5"]
# Real vocal separation (htdemucs). Heavy: pulls torch + ~80 MB model download.
# Optional — vocal_activity falls back to the HPSS proxy without it.
vocals = ["demucs>=4.0", "torch>=2.0"]
# Full stem-aware layer (vocals, bass, drums, other/accompaniment).
stems = ["demucs>=4.0", "torch>=2.0"]
dev = [
    "pytest>=8.2",
    "httpx>=0.28",
    # Upper bound deliberate: uv.lock pins 0.15.x and CI runs that. Ruff 0.16
    # widened its default rule set, so an unbounded `pip install -e ".[dev]"`
    # handed a reviewer a linter stricter than the gate and 288 findings on a
    # clean clone. Raise both together, never just this one.
    "ruff>=0.15,<0.16",
    "pre-commit>=3.7",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[project.scripts]
dancelab = "dancelab.cli.analyze:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dancelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ENV-1: macOS provenance keeps hiding the editable .pth (site.py skips hidden
# .pth files), breaking `import dancelab`. This makes the suite independent of
# that whole failure family — pytest injects src/ itself.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
