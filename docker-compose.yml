services:
  api:
    build: .
    command: ["uvicorn", "dancelab.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DANCELAB_CONFIG: configs/default.yaml
      DANCELAB_DB_URL: postgresql://dancelab:dancelab@db:5432/dancelab
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  db:
    # pgvector image = stock Postgres 16 plus the `vector` extension. The
    # catalog stores CLAP embeddings, so nearest-neighbour search happens in
    # the database instead of loading every vector into Python.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dancelab
      POSTGRES_PASSWORD: dancelab
      POSTGRES_DB: dancelab
    # Bound to loopback: the catalog tooling runs on the host, not in a
    # container, and needs to reach the database directly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancelab -d dancelab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
