<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanceLab — scena v2 (start od zera)</title>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
  :root{--tlo:#141312; --tekst:#e8e4da; --przygaszony:#8f8a7e; --slaby:#5c5850;
    --volt:#d6f549; --linia:#3a3730; --r:3px}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{background:var(--tlo); color:var(--tekst);
    font-family:"Space Grotesk", system-ui, sans-serif}
  #plotno{position:fixed; inset:0; width:100vw; height:100vh; display:block}
  .ui{position:fixed; z-index:5; transition:opacity .5s}
  body.spokoj .ui{opacity:0; pointer-events:none}
  #stan{top:14px; left:16px; font-size:11px; color:var(--slaby);
    letter-spacing:.4px; line-height:1.7}
  #stan b{color:var(--przygaszony); font-weight:500}
</style>
</head>
<body>
<canvas id="plotno"></canvas>
<div id="stan" class="ui">scena v2 · czyste płótno<br>czekam na pierwszą warstwę</div>

<script>
/* SCENA v2 — start od zera (Janek 13.08).
   Tu jest tylko fundament: płótno w natywnej rozdzielczości, dane szwów
   z profilami policzonymi PRZEZ SILNIK, deterministyczna losowość i pętla
   klatek. Żadnej warstwy wizualnej — dokładamy je po kolei, na Twoje
   polecenie, każdą osobno i nazwaną.

   Czego uczy nas poprzednie podejście (żeby nie powtórzyć):
   · każdy element ma WŁASNE stałe ziarno — inaczej obraz miga;
   · warstwy dopisujemy jako osobne funkcje w WARSTWY[] — łatwo wyłączyć;
   · nic nie rysujemy „na oko": każda cecha ma nieść liczbę z danych. */

const cv = document.getElementById("plotno");
const ctx = cv.getContext("2d");
let W = 0, H = 0, MIN = 0;

function wymiary(){
  const DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; MIN = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", wymiary); wymiary();

/* deterministyczna losowość — ziarno z tekstu, nigdy Math.random */
function hash(s){let h=7; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return h>>>0||1}
function rnd(seed){let s=seed; return ()=>{s^=s<<13; s^=s>>>17; s^=s<<5;
  return (s>>>0)/4294967296}}

/* dane: przejścia z mapy DJ-ów + profil In Between policzony przez silnik
   (C, D, Syn, U, K, okreslone) oraz pętla DJ↔muzyka (iDJ, iM, Cdj, Ddj) */
let SZWY = {};
let KTO = "Tim Reaper";
let GRACZ = null;               // odtwarzacz dojdzie, gdy powiesz
let FRAKCJA = null;             // pozycja w secie: null = pętla własna

/* WARSTWY: każda to funkcja (ctx, k) → rysuje jedną rzecz.
   Dodajemy je po kolei na Twoje polecenie. */
const WARSTWY = [];

/* ── WARSTWA 1 · POLE MOŻLIWOŚCI ──────────────────────────────────────
   „Zanim malarz dotknie pędzlem płótna" — przed decyzją jest wszystko:
   setki tysięcy możliwości, sprzężonych, wynikających jedna z drugiej.
   Nic nie jest tu rozdzielone, więc nie rysujemy punktów — rysujemy
   CIĄGŁE PASMA, jak widmo światła przed pryzmatem.

   Materia jest prawdziwa: gęstość pasm to rzeczywisty rozkład 9 750
   zmierzonych utworów mapy w przestrzeni tempo × energia. Tam, gdzie
   biblioteka jest bogata, widmo jest jasne; gdzie uboga — ciemnieje. */
let POLE = null;
fetch("mozliwosci.json?v=" + Date.now()).then(r => r.json()).then(d => POLE = d);

function gestosc(bpm, en){
  if (!POLE) return 0;
  const ib = Math.max(0, Math.min(POLE.nb - 1,
    Math.floor((bpm - POLE.bpm_od) / (POLE.bpm_do - POLE.bpm_od) * POLE.nb)));
  const ie = Math.max(0, Math.min(POLE.ne - 1, Math.floor(en * POLE.ne)));
  return POLE.siatka[ib][ie];
}

function warstwaMozliwosci(ctx, k){
  if (!POLE) return;
  const {czas, cx, cy, W, H, MIN} = k;
  const PASM = 420;
  for (let i = 0; i < PASM; i++){
    const r = rnd(hash("mozliwosc" + i));
    // każde pasmo to jedna ścieżka przez przestrzeń możliwości:
    // wysokość = tempo, jasność = ile utworów naprawdę tam jest
    const bpm0 = 60 + r() * 140;
    const en0 = r();
    const g = gestosc(bpm0, en0);
    if (g < 0.006) continue;
    const y0 = H * (0.97 - (bpm0 - 60) / 140 * 0.94);
    const faza = r() * 6.283, tempoDryfu = 0.05 + r() * 0.12;
    const amp = H * (0.035 + g * 0.09);
    ctx.strokeStyle = `rgba(232,228,218,${(0.02 + g * 0.22).toFixed(3)})`;
    ctx.lineWidth = 0.4 + g * 1.8;
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 14){
      const u = x / W;
      // pasma nie są równoległe — splatają się, bo możliwości wynikają
      // jedna z drugiej (sprzężenie, nie osobne byty)
      const y = y0 + Math.sin(u * 5.2 + faza + czas * tempoDryfu) * amp
                   + Math.sin(u * 11.7 + faza * 2 - czas * tempoDryfu * 0.6) * amp * 0.45;
      x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
WARSTWY.push(warstwaMozliwosci);

/* ── WARSTWA 2 · SPLATANIE ────────────────────────────────────────────
   „Nie ma jednej myśli" — DJ nie wybiera jednej nitki z pola. To magia
   połączeń, często nieoczywistych: wspomnienie z dzieciństwa, zapach,
   twarz z parkietu, instynkt. Wiele nici z przeszłości zaczyna się
   wiązać w jedną grubszą — i dopiero z niej zapada PIERWSZA DECYZJA.

   Punkt docelowy nie jest wymyślony: to tempo pierwszego utworu tego
   setu (z mapy), na tej samej skali wysokości co pole możliwości. Nici
   przypływają falami — instynkt nie działa równym strumieniem.
   Im bliżej decyzji, tym mocniej się splatają. Na końcu: klik play. */
function warstwaSplatanie(ctx, k){
  if (!POLE || !k.szwy.length) return;
  const {czas, W, H} = k;
  const bpm1 = k.szwy[0].a || 128;
  const yOs = H * (0.97 - (bpm1 - 60) / 140 * 0.94);
  const CYKL = 30, faza = (czas % CYKL) / CYKL;
  const splot = Math.min(1, faza / 0.45);              // warkocz się zaplata
  const wedrowka = Math.max(0, (faza - 0.45) / 0.55);  // punkt idzie po nim

  // OŚ WARKOCZA — nie jest rysowana. To linia, wokół której splatają się
  // te same włosy, które przed chwilą były luźne (Janek: „nie wyrywasz
  // fragmentu z głowy i nie splatasz obok").
  const os = (u) => yOs + Math.sin(u * 3.1 + czas * 0.18) * H * 0.045
                        + Math.sin(u * 7.4 - czas * 0.11) * H * 0.018;
  const xA = W * 0.26, xB = W * 0.82;                  // strefa warkocza
  const MARG = W * 0.30;                              // długie, miękkie wejście
  const gladko = (v) => { const u = Math.max(0, Math.min(1, v));
                          return u * u * (3 - 2 * u); };
  const wStrefie = (x) => Math.min(gladko((x - (xA - MARG)) / MARG),
                                   gladko(((xB + MARG) - x) / MARG));

  const NICI = 130;
  let wplecionych = 0;
  for (let i = 0; i < NICI; i++){
    const r = rnd(hash("wlos" + i));
    const bpm0 = 60 + r() * 140, en0 = r();
    const g = gestosc(bpm0, en0);
    if (g < 0.008) continue;
    const y0 = H * (0.97 - (bpm0 - 60) / 140 * 0.94);
    const wejscie = r();                       // kiedy ten włos daje się wpleść
    const zywa = Math.max(0, Math.min(1, (splot - wejscie * 0.55) / 0.45));
    const bierze = zywa > 0.02;                // czy w ogóle wchodzi w warkocz
    if (bierze) wplecionych++;
    const pasmo = (r() - 0.5) * 2;             // miejsce w warkoczu (-1..1)
    const skret = 5 + r() * 4;                 // ile skrętów na długości
    const fazaS = r() * 6.283;
    const grubosc = H * 0.008;                 // promień warkocza

    ctx.beginPath();
    let pierwszy = true;
    const kroki = 120;
    for (let j = 0; j <= kroki; j++){
      const u = j / kroki;
      const x = -40 + (W + 80) * u;
      const uu = Math.max(0, Math.min(1, (x - xA) / (xB - xA)));
      const s = bierze ? wStrefie(x) * zywa : 0;       // ile splecione TU
      // luźny włos ma własną drogę; splatany zbiega do osi i ją oplata
      const wlasna = y0 + Math.sin(u * 5.4 + i) * H * 0.035
                        + Math.sin(u * 11.2 + i * 2) * H * 0.012;
      const owin = Math.sin(uu * skret * 6.283 + fazaS) * grubosc * pasmo;
      const y = wlasna + (os(uu) + owin - wlasna) * s;
      // kolor narasta ze splecieniem: szara możliwość → ciepła decyzja
      const c = [Math.round(206 + 49 * s), Math.round(202 + 26 * s),
                 Math.round(192 - 62 * s)];
      const alfa = (0.03 + g * 0.22) * (0.5 + s * 1.6);
      if (!pierwszy){
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alfa.toFixed(3)})`;
        ctx.lineWidth = (0.4 + g * 1.3) * (0.7 + s * 1.5);
        ctx.lineTo(x, y); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(x, y); pierwszy = false;
    }
  }

  // PUNKT: idzie po osi warkocza — po tym, co splotły włosy
  if (wedrowka > 0){
    const u = wedrowka;
    const x = xA + (xB - xA) * u, y = os(u);
    const puls = 0.8 + 0.2 * Math.sin(czas * 2.4);
    const rr = H * 0.014 * puls;
    const gg = ctx.createRadialGradient(x, y, 0, x, y, rr * 4);
    gg.addColorStop(0, "rgba(255,255,255,0.6)");
    gg.addColorStop(0.35, "rgba(255,228,150,0.14)");
    gg.addColorStop(1, "rgba(255,228,150,0)");
    ctx.fillStyle = gg;
    ctx.fillRect(x - rr * 4, y - rr * 4, rr * 8, rr * 8);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill();
  }
}
WARSTWY.push(warstwaSplatanie);

function kontekst(czas){
  const szwy = (SZWY[KTO] || []);
  const n = szwy.length;
  const teraz = n ? (FRAKCJA != null ? FRAKCJA * n : ((czas / 30) % 1) * n) : 0;
  const i = Math.max(0, Math.min(n - 1, Math.floor(teraz)));
  return {czas, szwy, n, teraz, i, s: szwy[i] || null,
          poprz: szwy[i - 1] || szwy[i] || null,
          cx: W / 2, cy: H / 2, W, H, MIN, hash, rnd};
}

function klatka(ts){
  const czas = ts / 1000;
  ctx.clearRect(0, 0, W, H);
  const k = kontekst(czas);
  for (const warstwa of WARSTWY) warstwa(ctx, k);
  requestAnimationFrame(klatka);
}
requestAnimationFrame(klatka);

/* interfejs znika, gdy patrzysz */
let cichoT;
addEventListener("pointermove", () => {
  document.body.classList.remove("spokoj");
  clearTimeout(cichoT);
  cichoT = setTimeout(() => document.body.classList.add("spokoj"), 2600);
});

fetch("szwy.json?v=" + Date.now()).then(r => r.json()).then(d => {
  SZWY = d;
  const n = (SZWY[KTO] || []).length;
  document.getElementById("stan").innerHTML =
    `scena v2 · czyste płótno<br><b>${KTO}</b> · ${n} przejść z profilem ` +
    `In Between<br>warstwa 1: <b>pole możliwości</b> · warstwa 2: <b>splatanie</b><br>` +
    `pierwszy utwór setu: ${(SZWY[KTO][0]||{}).a || '—'} uderzeń`;
});
</script>
</body>
</html>
