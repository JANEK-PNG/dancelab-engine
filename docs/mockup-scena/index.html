<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanceLab — scena: sieć przejść</title>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
  :root{--tlo:#121110; --tekst:#e8e4da; --przygaszony:#8f8a7e; --slaby:#5c5850;
    --volt:#d6f549; --linia:#3a3730; --r:3px}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{background:var(--tlo); color:var(--tekst);
    font-family:"Space Grotesk", system-ui, sans-serif}
  canvas{position:fixed; inset:0; width:100vw; height:100vh; display:block;
    cursor:ew-resize}
  .ui{position:fixed; z-index:5; transition:opacity .6s}
  body.spokoj .ui{opacity:0; pointer-events:none}
  #wybor{top:14px; left:16px; display:flex; gap:8px}
  .dj{border:1px solid var(--linia); border-radius:var(--r); padding:5px 12px;
    font-size:12px; color:var(--przygaszony); cursor:pointer;
    background:rgba(18,17,16,.7); font-family:inherit}
  .dj.on{border-color:var(--volt); color:var(--volt)}
  #graj{bottom:16px; left:16px; border:1px solid var(--linia);
    border-radius:var(--r); background:rgba(18,17,16,.7); color:var(--tekst);
    font-family:inherit; font-size:12px; letter-spacing:.5px;
    padding:7px 14px; cursor:pointer}
  #graj:hover{border-color:var(--volt); color:var(--volt)}
  #pasek-nocy{position:fixed; left:0; right:0; bottom:0; height:22px; z-index:4;
    cursor:ew-resize}
  #pasek-nocy::after{content:""; position:absolute; left:0; right:0; bottom:0;
    height:2px; background:var(--linia)}
  #postep{position:absolute; left:0; bottom:0; height:2px; width:0;
    background:var(--volt); z-index:1}
  #opis{bottom:16px; right:16px; font-size:11px; color:var(--slaby);
    max-width:340px; text-align:right; line-height:1.5}
  .sc-ukryty{position:fixed; width:1px; height:1px; opacity:0;
    pointer-events:none; border:0}
</style>
</head>
<body>
<canvas id="scena"></canvas>
<div id="wybor" class="ui"></div>
<button id="graj" class="ui" onclick="graj()">▶ POSŁUCHAJ SETU</button>
<div id="opis" class="ui">strumienie czasu: każde włókno to jedno przejście
  między utworami · w chwili przejścia wystrzeliwują rozgałęzienia i iskry ·
  zgodne tonacyjnie płyną daleko, idealne świecą voltem, zgrzyty urywają się
  poszarpane · ciągnij, żeby przewinąć noc</div>
<div id="pasek-nocy"><div id="postep"></div></div>

<script>
const cv = document.getElementById("scena");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function wymiary(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", () => { wymiary(); PLANY = {}; });
wymiary();

const ZG = new Set(["idealna","sasiednia","rownolegla"]);
const t01 = v => Math.max(0, Math.min(1, (v - 95) / 95));
const COOL = [86,186,255], WARM = [255,150,52], VOLT = [214,245,73];
const mix = t => {                       // krzywa S: środek nie szarzeje
  const s = t * t * (3 - 2 * t);
  return COOL.map((v, i) => Math.round(v + (WARM[i] - v) * s));
};

function hash(s){let h=7; for(const c of s) h=(h*31+c.charCodeAt(0))&0xFFFFFFFF;
  return h>>>0||1}
function rnd(seed){let h=seed; return ()=>{h^=(h<<13)&0xFFFFFFFF; h^=h>>>17;
  h^=(h<<5)&0xFFFFFFFF; return (h>>>0)/4294967296}}

/* STRUMIENIE CZASU (kadr Janka: gałęzie czasu): materią sceny są
   ŚWIETLISTE WŁÓKNA — jedno na przejście. Płyną przez noc na wysokości
   swojego tempa; w chwili przejścia wystrzeliwują rozgałęzienia i iskry.
   Zgodne tonacyjnie płyną długo i gładko, idealne świecą voltem,
   zgrzyty rozpryskują się w poszarpane odnogi. */
let PLANY = {};
function galaz(r, x, y, kat, dl, glebia){
  // rozgałęzienie fraktalne — jak wyładowanie
  const pkt = [{x, y}];
  let cx = x, cy = y, k = kat;
  const kroki = Math.max(3, Math.round(dl / 7));
  for (let i = 0; i < kroki; i++){
    k += (r() - 0.5) * 0.55;
    cx += Math.cos(k) * 7; cy += Math.sin(k) * 7;
    pkt.push({x: cx, y: cy});
  }
  const dzieci = [];
  if (glebia > 0){
    const ile = 1 + (r() > 0.55 ? 1 : 0);
    for (let d = 0; d < ile; d++){
      const i = Math.floor(pkt.length * (0.35 + r() * 0.5));
      const w = pkt[Math.min(i, pkt.length - 1)];
      dzieci.push(galaz(r, w.x, w.y, kat + (r() - 0.5) * 1.9,
                        dl * (0.42 + r() * 0.25), glebia - 1));
    }
  }
  return {pkt, dzieci};
}
function plan(ksywa, szwy){
  const klucz = ksywa + W + "x" + H;
  if (PLANY[klucz]) return PLANY[klucz];
  // MECHANIKA KARTY 1:1 (Janek: „to nie to samo co kafelek"): nici cienkie
  // i DŁUGIE, rozsiane po CAŁEJ wysokości, płynące po wspólnym polu sił.
  const r = rnd(hash(ksywa + "jedwab"));
  const skoki = szwy.map(s => Math.abs(s.d));
  const srSkok = skoki.reduce((a, b) => a + b, 0) / Math.max(1, skoki.length);
  const groove = 0.35;
  const turb = 0.5 + Math.min(srSkok / 20, 1) * 2.2 + groove * 0.8;
  const a1 = 0.0026 + r() * 0.0018, a2 = 0.0032 + r() * 0.0024,
        a3 = 0.0019 + r() * 0.0016;
  const p1 = r() * 6.28, p2 = r() * 6.28, p3 = r() * 6.28;
  const pole = (x, y) => (Math.sin(x * a1 + p1) + Math.cos(y * a2 * (1 + groove) + p2)
                          + Math.sin((x + y) * a3 + p3)) * turb;
  const skala = Math.max(1, W / 600);          // krok rośnie z ekranem
  const wlokna = [];
  szwy.forEach((s, i) => {
    const perf = s.h === "idealna", czysty = ZG.has(s.h);
    const ile = perf ? 3 : czysty ? 2 : 2;     // kilka nici na przejście
    for (let k = 0; k < ile; k++){
      let x = (i / szwy.length) * W + (r() - 0.5) * W * 0.15;
      let y = r() * H;                          // CAŁA wysokość, jak w karcie
      const dl = Math.round((perf ? 240 : czysty ? 190 : 26)
                            * (0.7 + r() * 0.6));
      const drzenie = czysty ? 0.1 : 1.2;
      const krok = 3.0 * skala;
      const pkt = [{x, y}];
      for (let j = 0; j < dl; j++){
        const kat = pole(x, y) + (r() - 0.5) * drzenie;
        x += Math.cos(kat) * krok; y += Math.sin(kat) * krok;
        pkt.push({x, y});
      }
      wlokna.push({pkt, perf, czysty, szew: i, c: mix(t01((s.a + s.b) / 2)),
                   f: r() * 6.28,
                   w: (perf ? 1.0 : czysty ? 0.9 + r() * 0.5 : 0.7) * skala});
    }
  });
  return PLANY[klucz] = {wlokna, n: szwy.length};
}

let DANE = {}, KTO = null, GRACZ = null, FRAC = 0, T0 = performance.now();

function sciezka(p, przes, faza, ile){
  ctx.beginPath();
  const n = Math.max(2, Math.round(p.length * ile));
  for (let i = 0; i < n; i++){
    const w = p[i];
    const d = Math.sin(faza + i * 0.35) * przes;
    i === 0 ? ctx.moveTo(w.x, w.y + d) : ctx.lineTo(w.x, w.y + d);
  }
  ctx.stroke();
}
function rysGalaz(g, przes, faza, ile, kolor, alfa, szer){
  ctx.strokeStyle = `rgba(${kolor[0]},${kolor[1]},${kolor[2]},${alfa.toFixed(3)})`;
  ctx.lineWidth = szer;
  sciezka(g.pkt, przes, faza, ile);
  for (const d of g.dzieci)
    rysGalaz(d, przes, faza, ile, kolor, alfa * 0.62, szer * 0.6);
}

function rysuj(ts){
  const czas = ts / 1000;
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0e0d0c"; ctx.fillRect(0, 0, W, H);
  const szwy = (DANE[KTO] || []);
  if (!szwy.length){ requestAnimationFrame(rysuj); return; }
  const P = plan(KTO, szwy);
  const frac = GRACZ ? FRAC : ((czas / 90) % 1);
  const prog = frac * P.n;
  document.getElementById("postep").style.width = (frac * 100).toFixed(2) + "%";
  const xs = (prog / P.n) * W;

  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const wl of P.wlokna){
    if (wl.szew > prog) continue;
    const wiek = prog - wl.szew;
    const ile = Math.min(1, wiek / 1.2);            // wysuwa się z ciemności
    const zaplon = 1 + 1.6 * Math.max(0, 1 - wiek / 1.5);
    const zT = Math.max(0, Math.min(1, wiek / (P.n * 0.9)));
    const glab = 1 - 0.5 * zT, skalaZ = 1 - 0.4 * zT;   // oś Z: przeszłość w głąb
    const n = Math.max(2, Math.round(wl.pkt.length * ile));
    const c = wl.perf ? VOLT : wl.c;
    const alfa = wl.perf ? Math.min(0.9, 0.4 * zaplon) * glab
      : wl.czysty ? Math.min(0.95, 0.45 * zaplon) * glab
      : Math.min(0.8, 0.34 * zaplon) * glab;
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alfa.toFixed(3)})`;
    ctx.lineWidth = wl.w * skalaZ;
    ctx.beginPath();
    for (let i = 0; i < n; i++){
      const w = wl.pkt[i];
      i === 0 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y);
    }
    ctx.stroke();
  }
  // iskry zapłonu: nici odkrywane w tej chwili świecą u nasady
  ctx.globalCompositeOperation = "lighter";
  for (const wl of P.wlokna){
    const xN = (wl.szew / P.n) * W;
    if (xN > xs || xs - xN > W * 0.06) continue;
    const sila = 1 - (xs - xN) / (W * 0.06);
    const w = wl.pkt[0];
    const rr = 16 * sila * (wl.perf ? 1.6 : 1);
    const c = wl.perf ? VOLT : [232, 228, 218];
    const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, rr);
    g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${(0.55 * sila).toFixed(3)})`);
    g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(w.x - rr, w.y - rr, rr * 2, rr * 2);
  }
  // światło nocy — głowica na osi czasu
  const ys = H * 0.5 + Math.sin(czas * 0.4) * H * 0.06;
  const rr = 26;
  const g = ctx.createRadialGradient(xs, ys, 0, xs, ys, rr);
  g.addColorStop(0, "rgba(232,228,218,0.55)");
  g.addColorStop(1, "rgba(232,228,218,0)");
  ctx.fillStyle = g; ctx.fillRect(xs - rr, ys - rr, rr * 2, rr * 2);
  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(rysuj);
}
requestAnimationFrame(rysuj);

/* dźwięk pod spodem — ten sam wzór co na karcie */
const LINKI = {
  "Tim Reaper": ["https://soundcloud.com/resident-advisor/ra1000-timreaper", 1],
  "Piasecki": ["https://soundcloud.com/piasecki/ep398", 3],
  "Catz 'n Dogz": ["https://soundcloud.com/catzndogz/music-not-genres-by-catz-n-dogz-newonce-radio-25042020", 0],
};
function graj(){
  const guzik = document.getElementById("graj");
  if (GRACZ && !document.querySelector("iframe.sc-ukryty")) GRACZ = null;
  if (GRACZ){
    if (GRACZ.gra) GRACZ.widget.pause(); else GRACZ.widget.play();
    return;
  }
  const [url, setIdx] = LINKI[KTO];
  DANE[KTO + "#pelny"] = DANE[KTO];               // zapas: pełna sieć
  DANE[KTO] = DANE[KTO].filter(s => s.set === setIdx);  // gramy JEDEN set
  PLANY = {};
  const fr = document.createElement("iframe");
  fr.className = "sc-ukryty"; fr.allow = "autoplay";
  fr.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url)
    + "&auto_play=false&visual=false";
  document.body.appendChild(fr);
  const w = SC.Widget(fr);
  GRACZ = {widget: w, dur: 0, gra: false};
  w.bind(SC.Widget.Events.READY, () => { w.getDuration(ms => GRACZ.dur = ms);
    w.setVolume(80); w.play(); });
  w.bind(SC.Widget.Events.PLAY, () => { GRACZ.gra = true;
    guzik.textContent = "⏸ PAUZA"; });
  w.bind(SC.Widget.Events.PAUSE, () => { GRACZ.gra = false;
    guzik.textContent = "▶ WZNÓW"; });
  w.bind(SC.Widget.Events.PLAY_PROGRESS, e => {
    if (GRACZ.dur) FRAC = e.currentPosition / GRACZ.dur;
    else w.getDuration(ms => GRACZ.dur = ms);
  });
}
// przewijanie: pasek nocy na dole + ciągnięcie po scenie
let ciagnie = false, ostatniSeek = 0;
function przewin(ev){
  const frac = Math.max(0, Math.min(1, ev.clientX / W));
  FRAC = frac;
  const teraz = performance.now();
  if (GRACZ && GRACZ.dur && teraz - ostatniSeek > 140){
    ostatniSeek = teraz; GRACZ.widget.seekTo(frac * GRACZ.dur);
  }
}
for (const cel of [cv, document.getElementById("pasek-nocy")]){
  cel.addEventListener("pointerdown", ev => { if (GRACZ){ ciagnie = true; przewin(ev); } });
}
addEventListener("pointermove", ev => { if (ciagnie) przewin(ev); });
addEventListener("pointerup", () => ciagnie = false);
addEventListener("keydown", ev => { if (ev.key === " "){ ev.preventDefault(); graj(); } });

// UI znika, gdy się skupiasz
let cichoTimer;
function ruch(){
  document.body.classList.remove("spokoj");
  clearTimeout(cichoTimer);
  cichoTimer = setTimeout(() => document.body.classList.add("spokoj"), 2600);
}
addEventListener("pointermove", ruch); ruch();

fetch("szwy.json").then(r => r.json()).then(d => {
  DANE = d;
  const w = document.getElementById("wybor");
  Object.keys(d).forEach(k => {
    const b = document.createElement("button");
    b.className = "dj"; b.textContent = k;
    b.onclick = () => {
      if (GRACZ){ GRACZ.widget.pause(); }
      GRACZ = null; FRAC = 0; PLANY = {};
      document.querySelectorAll(".sc-ukryty").forEach(f => f.remove());
      if (DANE[k + "#pelny"]){ DANE[k] = DANE[k + "#pelny"]; }
      KTO = k;
      document.getElementById("graj").textContent = "▶ POSŁUCHAJ SETU";
      document.querySelectorAll(".dj").forEach(x =>
        x.classList.toggle("on", x.textContent === k));
    };
    w.appendChild(b);
  });
  w.children[0].click();
});
</script>
</body>
</html>
