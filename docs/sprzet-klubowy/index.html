<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprzęt klubowy — czego FLX4 Cię nie nauczy</title>
<style>
  :root{
    --tlo:#0e1013; --karta:#161a1f; --kreska:#242a32;
    --tekst:#e8ecf1; --cichy:#8a94a2; --cichszy:#5e6773;
    --jest:#6bbf6b; --inaczej:#e0a458; --brak:#e06c75; --pulapka:#5aa9e6;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--tlo);color:var(--tekst);font-family:var(--font);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:1180px;margin:0 auto;padding:26px 32px 0}
  h1{font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .podtytul{color:var(--cichy);font-size:13.5px;margin-bottom:20px;max-width:76ch}
  main{max-width:1180px;margin:0 auto;padding:0 32px 80px}

  .licznik{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;margin-bottom:8px}
  .kafel{background:var(--karta);border:1px solid var(--kreska);border-radius:9px;
    padding:13px 15px;cursor:pointer;text-align:left;font:inherit;color:inherit;
    border-left-width:3px;transition:background .12s}
  .kafel:hover{background:#1b2027}
  .kafel[aria-pressed="true"]{background:#1e242c;border-color:var(--kreska)}
  .kafel.jest{border-left-color:var(--jest)}
  .kafel.inaczej{border-left-color:var(--inaczej)}
  .kafel.brak{border-left-color:var(--brak)}
  .kafel.pulapka{border-left-color:var(--pulapka)}
  .kafel .n{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;
    line-height:1.15}
  .kafel .co{font-size:12.5px;color:var(--cichy);margin-top:2px}
  .kafel .opis{font-size:12px;color:var(--cichszy);margin-top:5px;line-height:1.4}

  .rysunek{background:var(--karta);border:1px solid var(--kreska);border-radius:10px;
    padding:16px;margin:20px 0 6px;overflow-x:auto}
  .rysunek svg{display:block;width:100%;min-width:760px;height:auto}
  .el{cursor:pointer}
  .el .ksztalt{stroke-width:1.5;transition:fill-opacity .12s}
  .el:hover .ksztalt{fill-opacity:.45}
  .el.wybrany .ksztalt{stroke-width:2.5}
  .el.przygaszony{opacity:.16}
  .el text{font-size:9px;fill:#c3ccd6;pointer-events:none;font-family:var(--font)}
  .obudowa{fill:#12161b;stroke:#2b333c;stroke-width:1.5}
  .podpis-urz{font-size:11px;fill:var(--cichy);font-family:var(--font)}
  .schemat-nota{color:var(--cichszy);font-size:12px;margin:0 0 18px;line-height:1.5}
  .wybor{background:var(--karta);border:1px solid var(--kreska);border-radius:9px;
    padding:13px 16px;margin:0 0 20px;font-size:13.5px;display:none}
  .wybor.widoczny{display:block}
  .wybor .tytul{font-weight:600;margin-bottom:2px}
  .filtr-info{color:var(--cichy);font-size:13px;margin:14px 0 22px;min-height:20px}
  .filtr-info button{background:none;border:0;color:var(--blekit,#5aa9e6);
    font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}

  h2{font-size:16px;font-weight:600;margin:30px 0 3px;letter-spacing:-.005em}
  h2 .rola{font-weight:400;color:var(--cichy);font-size:13px}
  h3{font-size:12px;font-weight:600;color:var(--cichy);text-transform:uppercase;
     letter-spacing:.05em;margin:20px 0 8px}

  .lista{display:grid;gap:7px}
  .k{background:var(--karta);border:1px solid var(--kreska);border-left-width:3px;
     border-radius:8px;padding:11px 15px;cursor:pointer}
  .k:hover{background:#1a1f26}
  .k.jest{border-left-color:var(--jest)}
  .k.inaczej{border-left-color:var(--inaczej)}
  .k.brak{border-left-color:var(--brak)}
  .k.pulapka{border-left-color:var(--pulapka)}
  .k .naglowek{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .k .nazwa{font-weight:500}
  .k .znacznik{font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 7px;border-radius:4px;white-space:nowrap}
  .znacznik.jest{background:rgba(107,191,107,.14);color:var(--jest)}
  .znacznik.inaczej{background:rgba(224,164,88,.14);color:var(--inaczej)}
  .znacznik.brak{background:rgba(224,108,117,.14);color:var(--brak)}
  .znacznik.pulapka{background:rgba(90,169,230,.14);color:var(--pulapka)}
  .k .co-robi{color:var(--cichy);font-size:13px;margin-top:3px}
  .k .szczegol{margin-top:9px;padding-top:9px;border-top:1px solid var(--kreska);
    font-size:13px;display:none}
  .k[aria-expanded="true"] .szczegol{display:block}
  .k .dlaczego{color:var(--tekst)}
  .k .flx4{color:var(--cichszy);font-family:var(--mono);font-size:12px;margin-top:6px}
  .pusto{color:var(--cichszy);font-size:13.5px;padding:16px 0}
  footer{max-width:1180px;margin:0 auto;padding:0 32px 40px;color:var(--cichszy);
    font-size:12.5px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>Sprzęt klubowy — czego FLX4 Cię nie nauczy</h1>
  <div class="podtytul">Zestaw, który zastaniesz za pulpitem: dwa CDJ-3000 i mikser
    DJM-900NXS2. Każda kontrolka pokazana względem tego, co masz w domu.
    Kliknij kafel, żeby zobaczyć tylko jedną grupę; kliknij kontrolkę, żeby
    dowiedzieć się dlaczego to ma znaczenie.</div>
</header>

<main>
  <div class="licznik" id="licznik"></div>
  <div class="rysunek" id="rysunek"></div>
  <p class="schemat-nota" id="schemat-nota"></p>
  <div class="wybor" id="wybor"></div>
  <div class="filtr-info" id="filtr-info"></div>
  <div id="tresc"></div>
</main>

<footer id="stopka"></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const OPIS = {
  jest:     ['Masz to',        'Działa tak samo jak u Ciebie. Przećwiczysz w domu.'],
  inaczej:  ['Masz, ale inne', 'Podobne, ale zachowuje się inaczej. To zaskakuje najbardziej.'],
  brak:     ['Nie masz wcale', 'Pierwszy raz zobaczysz w klubie. Tego nie da się przećwiczyć na FLX4.'],
  pulapka:  ['Pułapka',        'Masz to na FLX4, a w klubie tego NIE MA. Nie przyzwyczajaj się.'],
};
const KOLEJNOSC = ['brak', 'inaczej', 'pulapka', 'jest'];

let dane = null;
let uklad = null;
let filtr = null;
let wybrana = null;
let indeks = {};   // nazwa kontrolki -> jej wpis z kontrolki.json

const BARWA = {jest:'#6bbf6b', inaczej:'#e0a458', brak:'#e06c75', pulapka:'#5aa9e6'};

function zbudujIndeks() {
  indeks = {};
  dane.urzadzenia.forEach(u => u.sekcje.forEach(s => s.kontrolki.forEach(k => {
    indeks[k.nazwa] = k;
  })));
}

function ksztaltSVG(e, ox, oy, kolor, klasy, tytul) {
  const wsp = `data-k="${esc(e.k)}"`;
  const st = `class="ksztalt" fill="${kolor}" fill-opacity="0.22" stroke="${kolor}"`;
  let ksz = '', tx = 0, ty = 0;
  if (e.ksztalt === 'kolo') {
    ksz = `<circle cx="${ox + e.x}" cy="${oy + e.y}" r="${e.r}" ${st}/>`;
    tx = ox + e.x; ty = oy + e.y + 3;
  } else {
    ksz = `<rect x="${ox + e.x}" y="${oy + e.y}" width="${e.w}" height="${e.h}"
                 rx="3" ${st}/>`;
    tx = ox + e.x + e.w / 2; ty = oy + e.y + e.h / 2 + 3;
  }
  const et = e.etykieta
    ? `<text x="${tx}" y="${ty}" text-anchor="middle">${esc(e.etykieta)}</text>` : '';
  return `<g class="el ${klasy}" ${wsp} tabindex="0" role="button">
            <title>${esc(tytul)}</title>${ksz}${et}</g>`;
}

function rysujSchemat() {
  if (!uklad || !dane) return;
  let tresc = '';
  const zrodla = {};
  uklad.urzadzenia.forEach(u => { if (u.elementy) zrodla[u.id] = u.elementy; });

  uklad.urzadzenia.forEach(u => {
    const el = u.elementy || zrodla[u.kopia_z] || [];
    tresc += `<rect class="obudowa" x="${u.x + 4}" y="12" width="${u.w - 8}"
                    height="${u.h - 4}" rx="8"/>`;
    tresc += `<text class="podpis-urz" x="${u.x + 12}" y="8">${esc(u.nazwa)}
              — ${esc(u.podpis)}</text>`;

    el.forEach(e => {
      const k = indeks[e.k];
      if (!k) return;
      const kolor = BARWA[k.stan];
      const przygas = filtr && k.stan !== filtr ? 'przygaszony' : '';
      const wyb = wybrana === e.k ? 'wybrany' : '';
      const tytul = `${e.k} — ${OPIS[k.stan][0]}`;

      if (e.ksztalt.startsWith('rzad_')) {
        // one control repeated across every mixer channel
        (u.kanaly_x || []).forEach(kx => {
          const kopia = e.ksztalt === 'rzad_kol'
            ? {...e, ksztalt: 'kolo', x: kx + 14}
            : {...e, ksztalt: 'prostokat', x: kx + 14 - (e.w / 2)};
          tresc += ksztaltSVG(kopia, u.x, 0, kolor, `${przygas} ${wyb}`, tytul);
        });
      } else {
        tresc += ksztaltSVG(e, u.x, 0, kolor, `${przygas} ${wyb}`, tytul);
      }
    });
  });

  $('#rysunek').innerHTML =
    `<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">${tresc}</svg>`;
  $('#schemat-nota').textContent = uklad.UWAGA;

  document.querySelectorAll('.el').forEach(g => {
    const dzialaj = () => { wybrana = wybrana === g.dataset.k ? null : g.dataset.k; rysuj(); };
    g.addEventListener('click', dzialaj);
    g.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); dzialaj(); }
    });
  });
}

function rysujWybor() {
  const box = $('#wybor');
  const k = wybrana ? indeks[wybrana] : null;
  if (!k) { box.classList.remove('widoczny'); box.innerHTML = ''; return; }
  box.classList.add('widoczny');
  box.innerHTML = `
    <div class="tytul">${esc(k.nazwa)}
      <span class="znacznik ${k.stan}">${esc(OPIS[k.stan][0])}</span></div>
    ${k.co_robi ? `<div class="co-robi">${esc(k.co_robi)}</div>` : ''}
    ${k.dlaczego_wazne ? `<div style="margin-top:7px">${esc(k.dlaczego_wazne)}</div>` : ''}
    ${k.flx4 ? `<div class="flx4">na FLX4: ${esc(k.flx4)}</div>` : ''}`;
}

function policz() {
  const c = {jest:0, inaczej:0, brak:0, pulapka:0};
  dane.urzadzenia.forEach(u => u.sekcje.forEach(s => s.kontrolki.forEach(k => c[k.stan]++)));
  return c;
}

function rysujLicznik() {
  const c = policz();
  $('#licznik').innerHTML = KOLEJNOSC.map(stan => `
    <button class="kafel ${stan}" data-stan="${stan}"
            aria-pressed="${filtr === stan}">
      <div class="n">${c[stan]}</div>
      <div class="co">${esc(OPIS[stan][0])}</div>
      <div class="opis">${esc(OPIS[stan][1])}</div>
    </button>`).join('');
  document.querySelectorAll('.kafel').forEach(b =>
    b.addEventListener('click', () => {
      filtr = filtr === b.dataset.stan ? null : b.dataset.stan;
      rysuj();
    }));
}

function rysujTresc() {
  const info = $('#filtr-info');
  const c = policz();
  const ile = Object.values(c).reduce((a, b) => a + b, 0);
  info.innerHTML = filtr
    ? `Pokazuję ${c[filtr]} z ${ile}: <strong>${esc(OPIS[filtr][1])}</strong> ` +
      `<button id="wyczysc">pokaż wszystko</button>`
    : `Pokazuję wszystkie ${ile} kontrolek klubowego zestawu.`;
  if (filtr) $('#wyczysc').addEventListener('click', () => { filtr = null; rysuj(); });

  const html = dane.urzadzenia.map(u => {
    const sekcje = u.sekcje.map(s => {
      const ks = s.kontrolki.filter(k => !filtr || k.stan === filtr);
      if (!ks.length) return '';
      return `<h3>${esc(s.nazwa)}</h3><div class="lista">` + ks.map(k => `
        <div class="k ${k.stan}" tabindex="0" role="button" aria-expanded="false">
          <div class="naglowek">
            <span class="nazwa">${esc(k.nazwa)}</span>
            <span class="znacznik ${k.stan}">${esc(OPIS[k.stan][0])}</span>
          </div>
          ${k.co_robi ? `<div class="co-robi">${esc(k.co_robi)}</div>` : ''}
          <div class="szczegol">
            ${k.dlaczego_wazne ? `<div class="dlaczego">${esc(k.dlaczego_wazne)}</div>` : ''}
            ${k.flx4 ? `<div class="flx4">na FLX4: ${esc(k.flx4)}</div>` : ''}
            ${!k.dlaczego_wazne && !k.flx4 ? '<div class="flx4">brak dodatkowej notatki</div>' : ''}
          </div>
        </div>`).join('') + '</div>';
    }).join('');
    if (!sekcje) return '';
    return `<h2>${esc(u.nazwa)} <span class="rola">— ${esc(u.rola)}</span></h2>${sekcje}`;
  }).join('');

  $('#tresc').innerHTML = html || '<div class="pusto">nic w tej grupie</div>';

  document.querySelectorAll('.k').forEach(el => {
    const przelacz = () => el.setAttribute('aria-expanded',
      el.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    el.addEventListener('click', przelacz);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); przelacz(); }
    });
  });
}

function rysuj() { rysujLicznik(); rysujSchemat(); rysujWybor(); rysujTresc(); }

Promise.all([
  fetch('kontrolki.json', {cache: 'no-store'}).then(r => r.json()),
  fetch('uklad.json', {cache: 'no-store'}).then(r => r.json()),
])
  .then(([d, u]) => {
    dane = d; uklad = u;
    zbudujIndeks();
    rysuj();
    $('#stopka').textContent = d.uwaga;
  })
  .catch(e => { $('#tresc').innerHTML =
    `<div class="pusto">nie wczytałem danych: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
