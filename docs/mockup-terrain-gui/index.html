<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanceLab — GUI w skórze TERRAIN (struktura TUI, pełne klawisze)</title>
<style>
:root{
  --ink:#f2f1e9; --soft:#aaa99f; --dim:#8a897f;
  --ground:#11120f; --deep:#0a0b09;
  --sur:#181a16; --sur2:#20231d; --sur3:#292d25;
  --line:#373a32; --line2:#282b25;
  --volt:#d9ff43; --volt-ink:#101208;
  --deck-a:#65d8ff; --deck-b:#ffbd5d; --green:#69db98; --red:#ff6c66;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Manrope","Avenir Next","Segoe UI",sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);font-size:13.5px;display:flex;flex-direction:column;overflow:hidden}
svg{vertical-align:-2px}
.banner{background:var(--sur3);color:var(--soft);font-family:var(--mono);font-size:10.5px;text-align:center;padding:3px;letter-spacing:.06em}
.banner b{color:var(--volt)}
.tabs{display:flex;gap:2px;padding:6px 14px 0;background:var(--ground);border-bottom:1px solid var(--line)}
.tab{padding:7px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--ink);border-color:var(--volt)}
.main{flex:1;display:flex;min-height:0}
#ws{flex:1;display:flex;min-width:0}
/* panel */
.panel{width:340px;border-left:1px solid var(--line2);background:var(--ground);display:none;flex-direction:column;min-height:0}
.panel.open{display:flex}
.panel h3{margin:0;padding:10px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);border-bottom:1px solid var(--line2);white-space:pre-line;font-weight:400}
.plist{flex:1;overflow:auto;padding:4px 0}
.pop{padding:4px 14px;font-size:12.5px;color:var(--soft);cursor:pointer;border-radius:6px;margin:0 6px}
.pop.hdr{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.09em;margin-top:6px;cursor:default}
.pop.cur{background:var(--sur2);color:var(--ink);box-shadow:inset 2px 0 0 var(--volt)}
.pop .chk{color:var(--volt);display:inline-block;width:15px}
/* forma Set */
.formcol{width:380px;flex:0 0 auto;overflow:auto;padding:12px 16px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:4px;background:var(--ground)}
.flabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;color:var(--dim);margin-top:10px}
.fld{background:var(--sur);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;padding:9px 12px;width:100%}
.fld::placeholder{color:var(--dim)}
.sel{position:relative;background:var(--sur);border:1px solid var(--line);border-radius:9px;padding:9px 34px 9px 12px;cursor:pointer;color:var(--ink);transition:border-color .14s}
.sel:hover{border-color:var(--line)}
.sel:after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--soft);border-bottom:1.6px solid var(--soft);transform:translateY(-70%) rotate(45deg)}
.sel .k{font-family:var(--mono);font-size:9.5px;color:var(--dim);float:right;margin-right:8px}
.switchrow{display:flex;gap:10px;align-items:center;margin-top:8px;color:var(--soft);font-size:12.5px}
.swx{width:36px;height:20px;border-radius:10px;background:var(--sur3);position:relative;cursor:pointer;flex:0 0 auto;transition:background .14s}
.swx i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:all .14s}
.swx.on{background:var(--volt)}
.swx.on i{left:18px;background:var(--volt-ink)}
.cta{margin-top:14px;background:var(--volt);color:var(--volt-ink);border:none;border-radius:11px;padding:13px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .09s}
.cta:active{transform:scale(.98)}
.ghost{background:var(--sur2);color:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
/* prawa czesc */
.right{flex:1;display:flex;flex-direction:column;min-width:0}
.rhead{padding:10px 16px 4px;color:var(--ink)}
.tblwrap{flex:1;overflow:auto;padding:0 16px}
table{border-collapse:collapse;width:100%}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--soft);text-align:left;padding:3px 8px;font-weight:700;white-space:nowrap;position:sticky;top:0;background:var(--deep);cursor:pointer}
td{padding:5px 8px;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line2)}
tr.cur td{background:var(--sur2)}
tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--volt)}
.bpm{font-family:var(--mono);font-weight:700}.key{font-family:var(--mono)}
.ico-t{cursor:pointer;opacity:.9}
.badge{font-family:var(--mono);font-size:10px;border-radius:5px;padding:1px 6px}
.badge.rb{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.badge.reka{background:color-mix(in srgb,var(--deck-a) 18%,transparent);color:var(--deck-a)}
.badge.num{background:var(--sur2);color:var(--soft)}
/* player GUI */
.player{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line2);background:var(--ground)}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sur);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .09s}
.ic:hover{border-color:var(--soft)}
.ic:active{transform:scale(.94)}
.ic.big{width:46px;height:46px;background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.ic.small{width:32px;height:32px}
.cover{width:40px;height:40px;border-radius:7px;background:linear-gradient(135deg,var(--sur3),var(--sur))}
.pt{font-size:12.5px;line-height:1.35;min-width:150px}
.pt .dim{font-size:11px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--sur2);position:relative;cursor:pointer}
.prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--volt)}
.prog .knob{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translateX(-7px)}
.ptime{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:84px;text-align:right}
/* strip, warns, info */
.strip{margin:8px 16px 0;background:var(--sur);border:1px solid var(--line2);border-left:3px solid var(--deck-a);border-radius:9px;padding:7px 11px;font-family:var(--mono);font-size:11px;color:var(--soft)}
.warns{margin:8px 16px 0;background:var(--sur);border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--deck-b);max-height:100px;overflow:auto}
.infocard{margin:8px 16px 0;background:var(--sur);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--soft)}
.dim{color:var(--dim)}.soft{color:var(--soft)}.mono{font-family:var(--mono)}
/* status + footer */
.status{display:flex;gap:16px;padding:6px 16px;background:var(--ground);border-top:1px solid var(--line2);font-size:12px;color:var(--soft);align-items:center}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.footer{display:flex;gap:10px;padding:5px 16px;background:var(--deep);font-size:11px;color:var(--dim);flex-wrap:wrap;align-items:center}
kbd{font-family:var(--mono);font-size:10px;background:var(--sur2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}
.fk{display:inline-flex;gap:5px;align-items:center;color:var(--soft)}
.footer .right{margin-left:auto}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);background:var(--sur3);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:560px;opacity:0;pointer-events:none;transition:all .22s;font-size:12.5px;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--volt)}
.modal-back{position:fixed;inset:0;background:rgba(6,7,5,.7);display:none;align-items:center;justify-content:center;z-index:15}
.modal-back.open{display:flex}
.modal{width:390px;background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:20px}
.modal h2{margin:0 0 10px;font-size:14px}
.modal .hint{font-size:11px;color:var(--dim);margin-top:8px}
/* biblioteka */
.side{width:190px;flex:0 0 auto;border-right:1px solid var(--line2);padding:10px 0;background:var(--ground)}
.side .opt{padding:6px 14px;font-size:12.5px;color:var(--soft);cursor:pointer;display:flex;gap:8px;align-items:center}
.side .opt.active{color:var(--ink);background:var(--sur2);box-shadow:inset 2px 0 0 var(--volt)}
.side .opt.dis{color:var(--dim)}
.filters{display:flex;gap:8px;padding:10px 16px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--line);border-radius:9px;padding:0 12px}
.search input{flex:1;background:none;border:none;color:var(--ink);font:inherit;padding:8px 0;outline:none}
.filters .fld{width:110px;flex:0 0 auto;padding:8px 10px}
.licznik{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:4px 16px}
/* cue */
.cardtop{display:flex;gap:16px;padding:6px 16px 0}
.osgrid{display:grid;grid-template-columns:56px 1fr;gap:2px 10px;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px}
.osrow{position:relative;height:16px}
.sekstrip{display:flex;height:16px;border-radius:4px;overflow:hidden}
.sekstrip i{height:100%;display:flex;align-items:center;justify-content:center;font-size:8.5px;color:#cfd2c5;letter-spacing:.05em}
.padlet{position:absolute;top:-2px;font-size:10px;padding:0 4px;border-radius:3px;background:var(--sur3);color:var(--deck-b)}
.padlet.selp{background:var(--deck-b);color:#221500}
.padlet.cudzy{color:var(--red)}
.hotcue{width:320px;flex:0 0 auto;border-left:1px solid var(--line2);padding-left:14px}
.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.padb{height:58px;border-radius:6px;border:1px solid #000;position:relative;cursor:pointer;
 background:linear-gradient(180deg,#232520,#191b17);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.5);
 font-family:var(--mono);transition:all .09s;overflow:hidden}
.padb:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.padb .L{position:absolute;top:5px;left:7px;font-size:11px;font-weight:700;color:var(--dim)}
.padb .t{position:absolute;bottom:5px;right:7px;font-size:10px;color:var(--dim)}
.padb .tag{position:absolute;top:5px;right:7px;font-size:8px;letter-spacing:.08em;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:0 3px;opacity:.9}
.padb .lit{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.padb.set{background:linear-gradient(180deg,#2d2a1d,#211f15)}
.padb.set .L{color:var(--deck-b)} .padb.set .t{color:var(--deck-b)}
.padb.set .lit{background:var(--deck-b);box-shadow:0 -2px 8px color-mix(in srgb,var(--deck-b) 55%,transparent)}
.padb.cudzy{background:linear-gradient(180deg,#2d1d1d,#211515)}
.padb.cudzy .L{color:var(--red)} .padb.cudzy .t{color:var(--red)}
.padb.cudzy .lit{background:var(--red);box-shadow:0 -2px 8px color-mix(in srgb,var(--red) 45%,transparent)}
.padb.selp{border-color:var(--deck-b);box-shadow:0 0 0 1px var(--deck-b),inset 0 1px 0 rgba(255,255,255,.05)}
.padb.selp.cudzy{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.helpline{font-size:11px;color:var(--dim);padding:8px 16px;border-top:1px solid var(--line2);margin-top:8px}
.spark{height:20px;background:#0d0e0c;border-radius:3px;position:relative;overflow:hidden;min-width:260px}
.spark canvas{position:absolute;inset:0;width:100%;height:100%}
.spark b{position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--deck-b);font-weight:400;text-shadow:0 0 3px #000}
.sendrow{display:flex;gap:10px;justify-content:flex-end;padding:6px 16px 12px}
.cta.inline{margin:0;width:auto;padding:11px 20px;font-size:13px}
.cta.amber{background:var(--deck-b);color:#221500}
.hide{display:none!important}
</style>
</head>
<body tabindex="0">
<div class="banner">POZORNA APKA · struktura TUI · skóra TERRAIN jako GUI · <b>klawisze działają jak w TUI</b> · Ctrl+Tab zakładki · Esc zamyka</div>
<div class="tabs" id="tabs">
 <div class="tab" data-t="lib">BIBLIOTEKA</div>
 <div class="tab active" data-t="set">SET</div>
 <div class="tab" data-t="cue">EKSPORT / CUE</div>
</div>
<div class="main"><div id="ws"></div>
 <div class="panel" id="panel"><h3 id="ptitle"></h3><div class="plist" id="plist"></div></div></div>
<div class="status" id="statusbar"></div>
<div class="footer" id="footer"></div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modal"><div class="modal">
 <h2>Nazwa planu</h2><input class="fld" id="planname" placeholder="np. piątek klub v2">
 <div class="hint">Enter zapisuje · Esc anuluje</div></div></div>

<script>
/* ── ikony SVG (zero emoji — reguła designu) ── */
const I={
 play:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',
 pause:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>',
 prev:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5h2v11H3zM14 2.5v11l-8-5.5z"/></svg>',
 next:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2.5h2v11h-2zM2 2.5v11l8-5.5z"/></svg>',
 rw:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8.5 2.5v11L1.5 8zM15 2.5v11L8 8z"/></svg>',
 ff:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.5 2.5v11L14.5 8zM1 2.5v11L8 8z"/></svg>',
 heart:(on)=>`<svg width="14" height="14" viewBox="0 0 16 16" fill="${on?'var(--red)':'none'}" stroke="${on?'var(--red)':'var(--dim)'}" stroke-width="1.4"><path d="M8 13.5C4 10.5 1.5 8 1.5 5.5 1.5 3.6 3 2.5 4.6 2.5 6 2.5 7.3 3.4 8 4.6c.7-1.2 2-2.1 3.4-2.1 1.6 0 3.1 1.1 3.1 3 0 2.5-2.5 5-6.5 8z"/></svg>`,
 flag:(on)=>`<svg width="13" height="13" viewBox="0 0 16 16" fill="${on?'var(--volt)':'none'}" stroke="${on?'var(--volt)':'var(--dim)'}" stroke-width="1.4"><path d="M3.5 1.5v13M3.5 2.5h9l-2 3 2 3h-9"/></svg>`,
 bolt:'<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M9 1 2.5 9H7l-1 6L13 7H8.5z"/></svg>',
 up:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 13V3M4 7l4-4 4 4M2.5 14.5h11"/></svg>',
 search:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--dim)" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',
 disc:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>',
 lib:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 2.5h3v11h-3zM7 2.5h3v11H7zM11.5 3.5l3-.7 2.5 10.7-3 .7z" transform="scale(.85)"/></svg>',
 listen:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10v-2a5 5 0 0 1 10 0v2M3 10a1.8 1.8 0 0 0 0 3.6h.8V10zm10 0a1.8 1.8 0 0 1 0 3.6h-.8V10z" fill="none"/></svg>'};

const TR=[
 ["Balearic Breeze","Sault",122.0,"8A","RB",62,"Organic House",6.4],
 ["Rivermouth","O'Flynn",121.0,"7A","RB",58,"Breaks / UK Bass",5.9],
 ["Warm Static","Kelly Lee Owens",120.0,"8B",0.62,44,"Electronica",6.8],
 ["Glass Court","Jayda G",124.0,"9B","RB",71,"House",6.1],
 ["Sunday Slow","HAAi",126.0,"10A","ręka",66,"Breaks / UK Bass",7.2],
 ["Tin Lake","Bicep",128.0,"9A","RB",77,"Electronica",6.6],
 ["Night Mover","Overmono",134.0,"9A","RB",83,"Breaks / UK Bass",5.8],
 ["Neon Polny","Catz 'N Dogz",125.0,"8A","RB",69,"House",7.0],
 ["Cegła","Zamilska",132.0,"4A",0.44,88,"Techno (Raw / Deep / Hypnotic)",5.5],
 ["Ostra","VTSS",138.0,"5A","RB",92,"Techno (Peak Time / Driving)",6.3],
 ["Kair","Eltron",127.0,"9A","RB",73,"House",6.9],
 ["Mgła","Olivia",119.0,"—",0.31,51,"Electronica",8.1]];
const JAK=[0.97,0.93,0.91,0.88,0.95,0.90,0.86,0.92,0.74];
const S={tab:'set',
 lib:{cur:0,fav:new Set([0,1,5]),fil:new Set([0,4,8]),okladki:false,sekcja:'Cała'},
 set:{built:false,order:[],cur:0,compare:false,info:false,notki:false,edits:0,plany:[["piątek klub",10],["chill open",8]]},
 cue:{cur:0,pads:{},sel:null,w:1,undo:[],tp:false,tpCur:0,tpVal:''},
 play:{on:false,poz:0,dl:384,kto:null},
 panel:null,pcur:0,gatWybrane:new Set(),kotwica:"— bez kotwicy —",kontur:false,modal:false};
TR.forEach((_,i)=>S.cue.pads[i]=[{l:'A',t:.12,cudzy:true},{l:'E',t:.64,eng:true}]);
const FRAZY=[["INTRO",0],["UP",28.2],["BREAK",56.5],["GROOVE",84.7],["GROOVE",141.2],["BREAK",169.4],["GROOVE",220.0],["OUTRO",290.0]];
const ws=document.getElementById('ws');
function toast(h,ms=3600){const t=document.getElementById('toast');t.innerHTML=h;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function czas(s){s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function pew(v){return v==="RB"?`<span class="badge rb">RB</span>`:v==="ręka"?`<span class="badge reka">ręka</span>`:`<span class="badge num">${typeof v==='number'?v.toFixed(2):v}</span>`}

const FOOT={
 lib:[['p','odsłuch'],['u','♥'],['f','filar'],['g','z filarów'],['k','okładki'],['i','info'],['^g','gatunki'],['^d','graj jak'],['q','wyjdź']],
 set:[['b','buduj'],['w','wyślij'],['z','zamień'],['x','wytnij'],['a','dopisz'],['s','zapisz plan'],['o','wczytaj'],['c','porównaj'],['i','info'],['l','notki'],['v','werdykt']],
 cue:[['a–h','pad'],['←→','o takt'],['t','czas/fraza'],['x','zdejmij'],['z','cofnij'],['s','szew'],['p','od pada'],['w','wyślij 2×']]};
function chrome(){
 document.getElementById('footer').innerHTML=FOOT[S.tab].map(f=>`<span class="fk"><kbd>${f[0]}</kbd>${f[1]}</span>`).join('')+`<span class="right fk"><kbd>^p</kbd>palette</span>`;
 document.getElementById('statusbar').innerHTML=`<span><span class="sdot"></span>Rekordbox zamknięty — W dostępne</span><span class="mono dim">backupy: 22</span><span class="mono dim">notki: 7 (L)</span><span class="mono dim" style="margin-left:auto">pula: experiments_priv/2026-07-30_rebuild/processed</span>`}

/* ── player GUI ── */
function playerRow(){const p=S.play;const t=p.kto!==null?TR[p.kto]:null;const proc=(p.poz/p.dl*100).toFixed(1);
 return `<div class="player">
  <button class="ic small" onclick="prevNext(-1)" title="Poprz.">${I.prev}</button>
  <button class="ic small" onclick="skok(-8)" title="-8 uderzeń">${I.rw}</button>
  <button class="ic big" onclick="grajPauza()" title="Graj/Pauza (Spacja)">${p.on?I.pause:I.play}</button>
  <button class="ic small" onclick="skok(8)" title="+8 uderzeń">${I.ff}</button>

/* Waveform po rekordboxowemu: STEREO (lustro względem osi) + trzy pasma —
   dół granatowy, środek bursztynowy, góra jasna. Rysowane od najniższego
   pasma (najwyższa amplituda) do najwyższego, jak w RB. Dane poglądowe. */
function rysujFale(cv,seed){
 const w=cv.width=cv.offsetWidth||300,h=cv.height=cv.offsetHeight||20,x=cv.getContext('2d');
 const mid=h/2;let s=seed||7;
 const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
 x.clearRect(0,0,w,h);
 for(let i=0;i<w;i+=2){
  const t=i/w;
  const env=.30+.70*Math.abs(Math.sin(t*Math.PI*1.25+(seed%7)*.7))*(t<.06?t/.06:(t>.94?(1-t)/.06:1));
  const lo=(rnd()*.45+.55)*env, md=(rnd()*.55+.35)*env*.72, hi=(rnd()*.6+.25)*env*.45;
  x.fillStyle='#2f5d9e';x.globalAlpha=.95;x.fillRect(i,mid-lo*mid,1.6,lo*h);
  x.fillStyle='#d9a53d';x.globalAlpha=.9;x.fillRect(i,mid-md*mid,1.6,md*h);
  x.fillStyle='#ece9dc';x.globalAlpha=.95;x.fillRect(i,mid-hi*mid,1.6,hi*h);
 }
 x.globalAlpha=.5;x.fillStyle='#000';x.fillRect(0,mid-.5,w,1);
}

  if(p.cudzy){toast('pad <b style="color:var(--red)">cudzy</b> — nietykalny (skip)')}
  else if(S.play.kto===c.cur){c.undo.push({i:c.cur,sel:idx,t:p.t});p.t=Math.min(.98,S.play.poz/S.play.dl);p.eng=false;toast(`pad <b>${L}</b> przeniesiony pod głowicę (${czas(S.play.poz)}) · snap do taktu`)}
  else toast('głowica nie gra tego utworu — Spacja najpierw')}
 else if(idx>=0){c.sel=idx;toast(`pad <b>${L}</b> wybrany${pads[idx].cudzy?' — <b style="color:var(--red)">cudzy, nietykalny</b>':''}`)}
 else{const t=S.play.on&&S.play.kto===c.cur?S.play.poz/S.play.dl:0.5;pads.push({l:L,t});c.sel=pads.length-1;toast(`nowy pad <b>${L}</b> @ ${S.play.on?'pozycja głowicy':'środek'} · snap do taktu`)}
 rCue()}
function grajPauza(){const kto=S.tab==='lib'?S.lib.cur:(S.tab==='set'&&S.set.built?S.set.order[S.set.cur]:S.tab==='cue'?S.cue.cur:null);
 if(kto===null){toast('najpierw zbuduj (B) albo zaznacz utwór');return}
 if(S.play.on&&S.play.kto===kto){S.play.on=false;toast('pauza (pozycja zapamiętana)')}
 else{S.play.on=true;S.play.kto=kto;if(S.tab==='cue'){const p=(S.cue.pads[kto]||[])[S.cue.sel];S.play.poz=p?p.t*S.play.dl:0;toast(`▶ gra od ${p?('pada '+p.l):'zera'} — dźwięk tylko z jawnego klawisza`)}else toast(`▶ ${TR[kto][0]} (pozornie, bez dźwięku)`)}
 rerender()}
function skok(n){if(!S.play.on){toast('skoki działają, gdy gra');return}S.play.poz=Math.min(S.play.dl,Math.max(0,S.play.poz+n*(60/126)));rerender()}
function prevNext(d){if(!S.play.on){toast('next/prev działa, gdy gra (wzorzec Quick Look)');return}
 if(S.tab==='lib'){S.lib.cur=Math.min(Math.max(S.lib.cur+d,0),TR.length-1);S.play.kto=S.lib.cur;S.play.poz=0}
 if(S.tab==='set'&&S.set.built){S.set.cur=Math.min(Math.max(S.set.cur+d,0),S.set.order.length-1);S.play.kto=S.set.order[S.set.cur];S.play.poz=0}
 rerender()}

document.body.addEventListener('keydown',e=>{
 const k=e.key,K=k.toLowerCase();
 if(S.modal){if(k==='Enter'){const n=document.getElementById('planname').value||'bez nazwy';S.set.plany.unshift([n,S.set.order.length]);S.modal=false;document.getElementById('modal').classList.remove('open');toast(`plan „<b>${n}</b>" zapisany (pozornie)`);rSet()}
  if(k==='Escape'){S.modal=false;document.getElementById('modal').classList.remove('open')}return}
 if(e.target.tagName==='INPUT'&&k!=='Escape'&&!(e.ctrlKey&&(K==='g'||K==='d'))&&k!=='Tab')return;
 if(S.tab==='cue'&&S.cue.tp){const c=S.cue;e.preventDefault();
  if(k==='Escape'){c.tp=false;c.tpVal='';rCue();return}
  if(k==='ArrowDown'){c.tpCur=Math.min(c.tpCur+1,FRAZY.length-1);rCue();return}
  if(k==='ArrowUp'){c.tpCur=Math.max(c.tpCur-1,0);rCue();return}
  if(k==='Enter'){const p=c.pads[c.cur][c.sel];
   if(c.tpVal){const m=c.tpVal.match(/^(\d+):(\d{1,2})(?:\.(\d))?$/);
    if(m){const sek=(+m[1])*60+(+m[2])+(m[3]?+m[3]/10:0);p.t=Math.min(.98,sek/S.play.dl);toast(`czas <b>${c.tpVal}</b> → dociągnięty do taktu`)}
    else{toast('format m:ss.d — np. 2:37.3');return}}
   else{p.t=Math.min(.98,FRAZY[c.tpCur][1]/S.play.dl);toast(`pad ${p.l} → fraza <b>${FRAZY[c.tpCur][0]}</b> (${czas(FRAZY[c.tpCur][1])})`)}
   p.eng=false;c.tp=false;c.tpVal='';rCue();return}
  if(k==='Backspace'){c.tpVal=c.tpVal.slice(0,-1);rCue();return}
  if(/^[0-9:.]$/.test(k)){c.tpVal+=k;rCue();return}
  return}
 if(e.ctrlKey&&k==='Tab'){e.preventDefault();const t=['lib','set','cue'];const i=t.indexOf(S.tab);setTab(t[(i+(e.shiftKey?2:1))%3]);return}
 if(e.ctrlKey&&K==='g'){e.preventDefault();S.panel==='gatunki'?closePanel():openPanel('gatunki');return}
 if(e.ctrlKey&&K==='d'){e.preventDefault();S.panel==='dj'?closePanel():openPanel('dj');return}
 if(S.panel){
  if(k==='ArrowDown'){e.preventDefault();panelMove(1);return}
  if(k==='ArrowUp'){e.preventDefault();panelMove(-1);return}
  if(k==='Enter'){e.preventDefault();panelEnter();return}
  if(k==='Escape'){closePanel();return}
  if(S.panel==='plany'&&K==='o'){panelEnter();return}
  if(S.panel==='plany'&&K==='x'){toast('plan usunięty do kosza (pozornie)');S.set.plany.splice(Math.max(0,S.pcur-1),1);drawPanel();return}
  if(S.panel==='filary'&&K==='f'){panelEnter();return}
  if(S.panel==='slot'&&K==='z'){panelEnter();return}}
 if(k==='Escape'){if(S.tab==='cue'&&S.cue.sel!==null){S.cue.sel=null;rCue();return}}
 if(k===' '||K==='p'){e.preventDefault();grajPauza();return}
 if(k==='ArrowLeft'||k==='ArrowRight'){const d=(k==='ArrowRight'?1:-1);
  if(S.tab==='cue'&&ruszPad(d*(e.shiftKey?8:1))){e.preventDefault();return}
  if(S.play.on){e.preventDefault();skok(d*(e.shiftKey?32:8));return}}
 if(k==='PageDown'||k==='PageUp'){if(S.play.on){e.preventDefault();skok(k==='PageDown'?128:-128);return}}
 if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const d=k==='ArrowDown'?1:-1;
  if(e.shiftKey&&S.tab==='set'&&S.set.built){const o=S.set,i=o.cur,j=i+d;if(j>=0&&j<o.order.length){[o.order[i],o.order[j]]=[o.order[j],o.order[i]];o.cur=j;o.edits++;toast('przesunięte (⇧↑↓)');rSet()}return}
  if(S.tab==='lib'){S.lib.cur=Math.min(Math.max(S.lib.cur+d,0),TR.length-1);if(S.play.on){S.play.kto=S.lib.cur;S.play.poz=0}rLib()}
  if(S.tab==='set'&&S.set.built){S.set.cur=Math.min(Math.max(S.set.cur+d,0),S.set.order.length-1);rSet()}
  if(S.tab==='cue'){S.cue.cur=Math.min(Math.max(S.cue.cur+d,0),TR.length-1);S.cue.sel=null;S.cue.w=1;rCue()}
  return}
 if(S.tab==='cue'&&K==='t'&&!e.ctrlKey&&!e.metaKey){const c=S.cue;
  if(c.sel===null){toast('najpierw wybierz pad (litera A–H)');return}
  if(c.pads[c.cur][c.sel].cudzy){toast('pad cudzy — nietykalny');return}
  c.tp=true;c.tpVal='';c.tpCur=0;rCue();return}
 if(S.tab==='cue'&&/^[a-h]$/.test(K)&&!e.ctrlKey&&!e.metaKey){klawiszPad(K);return}
 if(K==='b'){if(S.tab!=='set')setTab('set');buduj();return}
 if(K==='w'){klawiszW();return}
 if(K==='u'&&S.tab==='lib'){const i=S.lib.cur;S.lib.fav.has(i)?S.lib.fav.delete(i):S.lib.fav.add(i);toast(S.lib.fav.has(i)?'♥ dodany (karmi kotwicę ★)':'♥ zdjęty');rLib();return}
 if(K==='f'&&S.tab==='lib'){const i=S.lib.cur;S.lib.fil.has(i)?S.lib.fil.delete(i):S.lib.fil.add(i);toast(S.lib.fil.has(i)?'FILAR — musi zagrać':'filar zdjęty');rLib();return}
 if(K==='g'&&S.tab==='lib'){toast('<b>szkic z filarów</b> w Secie (złote flagi, BEZ budowy)');openPanel('filary');return}
 if(K==='k'&&S.tab==='lib'){S.lib.okladki=!S.lib.okladki;toast(`okładki ${S.lib.okladki?'ON — wiersze wyżej, mniej w kadrze (kompromis nazwany)':'off'}`);rLib();return}
 if(K==='i'){S.set.info=!S.set.info;rerender();return}
 if(K==='l'&&S.tab==='set'){S.set.notki=!S.set.notki;rSet();return}
 if(K==='c'&&S.tab==='set'){S.set.compare=!S.set.compare;rSet();return}
 if(K==='s'&&S.tab==='set'){if(!S.set.built){toast('najpierw zbuduj (B)');return}S.modal=true;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('planname').focus(),50);return}
 if(K==='s'&&S.tab==='cue'){toast('▶ <b>szew od padów</b> (pozornie): render z efektywnych padów');return}
 if(K==='o'&&S.tab==='set'){openPanel('plany');return}
 if(K==='z'&&S.tab==='set'){if(S.set.built)openPanel('slot');return}
 if(K==='z'&&S.tab==='cue'){const u=S.cue.undo.pop();if(u){S.cue.pads[u.i][u.sel].t=u.t;toast('cofnięte (migawka)');rCue()}else toast('nie ma czego cofać');return}
 if(K==='a'&&S.tab==='set'){if(S.set.built){openPanel('slot');toast('A: dopisz ZA zaznaczonym')}return}
 if(K==='x'&&S.tab==='set'){if(S.set.built&&S.set.order.length>2){S.set.order.splice(S.set.cur,1);S.set.cur=Math.min(S.set.cur,S.set.order.length-1);S.set.edits++;toast('wycięte (X)');rSet()}return}
 if(K==='x'&&S.tab==='cue'){const c=S.cue;if(c.sel!==null&&!c.pads[c.cur][c.sel].cudzy){c.undo.push({i:c.cur,sel:c.sel,t:c.pads[c.cur][c.sel].t});c.pads[c.cur].splice(c.sel,1);c.sel=null;toast('pad zdjęty (X) · Z cofa');rCue()}else if(c.sel!==null)toast('pad cudzy — nietykalny');return}
 if(K==='v'&&S.tab==='set'){toast('<b>werdykt zapisany</b> (pozornie)');return}
 if(K==='q'){toast('Q: w prawdziwej apce wyjście — makieta zostaje ;)');return}
});
setInterval(()=>{if(S.play.on){S.play.poz+=1;if(S.play.poz>=S.play.dl){S.play.on=false;S.play.poz=0;toast('koniec utworu — auto-next tylko spod kursora')}
 const f=document.querySelector('.prog .fill'),kn=document.querySelector('.prog .knob'),pt=document.querySelector('.ptime');
 if(f){const pr=(S.play.poz/S.play.dl*100).toFixed(1)+'%';f.style.width=pr;kn.style.left=pr;pt.textContent=`${czas(S.play.poz)} / ${czas(S.play.dl)}`}else rerender()}},1000);
function setTab(t){S.tab=t;document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));rerender();chrome()}
function rerender(){({lib:rLib,set:rSet,cue:rCue})[S.tab]()}
document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>setTab(t.dataset.t));
setTab('set');document.body.focus();
</script>
</body>
</html>
