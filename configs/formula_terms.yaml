# Formula term metadata (Formula Term Specification - Sprint 3 + Engine Scoring
# Model v0.1). Contract: "Claude Code must not implement formula terms as
# anonymous variables." Every weighted component in a decision score resolves to
# an entry here. scientific_status uses the ScientificStatus enum.
version: "0.1.0"

terms:
  # --- Transition Window Score components (γ) ---
  structural:
    formula_symbol: S_struct
    name: structural suitability
    scientific_status: source          # source-backed components + candidate application
    source_basis: ["onset / novelty / segmentation methods"]
    normalization_method: distance to nearest segment boundary (exp decay)
    missing_data_policy: neutral 0.5 + warning if no segment map
    validation_required: segment annotations
    cannot_claim: structure is correctly segmented without segment validation

  rhythm:
    formula_symbol: S_rhythm
    name: rhythmic stability
    scientific_status: inferred
    source_basis: ["beat / pulse / onset methods"]
    normalization_method: 1 - minmax(rolling std of spectral flux)
    missing_data_policy: spectral-flux proxy if no beatgrid; neutral if no flux
    validation_required: beatgrid + DJ transition windows
    cannot_claim: rhythmic stability equals danceability

  energy:
    formula_symbol: S_energy
    name: energy continuity
    scientific_status: inferred
    source_basis: ["RMS loudness"]
    normalization_method: 1 - minmax(|d RMS/dt|)
    missing_data_policy: neutral 0.5 + warning if no rms
    validation_required: DJ transition ratings
    cannot_claim: controlled energy equals good transition

  phrase:
    formula_symbol: S_phrase
    name: phrase alignment
    scientific_status: candidate
    source_basis: ["beatgrid phrase anchors", "segment-boundary snapping fallback"]
    normalization_method: distance to nearest phrase anchor + window-length fit
    missing_data_policy: segment-boundary fallback if no beatgrid; neutral 0.5 + warning only if no phrase anchors at all
    validation_required: phrase boundary annotations + DJ transition window ratings
    cannot_claim: phrase alignment is correct without phrase validation

  bass:
    formula_symbol: S_bass
    name: bass conflict freedom
    scientific_status: candidate       # bass conflict risk — candidate-model
    source_basis: ["low-frequency energy (LFER)"]
    normalization_method: 1 - robust_percentile(bass energy)
    missing_data_policy: neutral 0.5 + warning if no LFER
    validation_required: pair ratings with bass-overlap cases
    cannot_claim: low bass conflict proves no clash without pair validation

  vocal_risk:
    formula_symbol: R_vocal
    name: vocal clash risk
    scientific_status: candidate
    source_basis: ["vocal density proxy from stems or HPSS fallback"]
    normalization_method: clip vocal density to [0,1]
    missing_data_policy: no penalty applied + warning if vocal proxy unavailable
    validation_required: vocal annotations + DJ false-positive review
    cannot_claim: low vocal risk proves no vocal conflict without vocal detection

  tension_conflict:
    formula_symbol: R_tension
    name: tension conflict risk
    scientific_status: candidate
    source_basis: ["candidate tension proxy from energy/spectral/instability cues"]
    normalization_method: robust_percentile(tension proxy)
    missing_data_policy: no penalty applied + warning if tension proxy unavailable
    validation_required: transition ratings across tension states
    cannot_claim: tension conflict equals listener emotion

  # --- Mixability-only components (λ) ---
  tempo:
    formula_symbol: S_tempo
    name: tempo fit
    scientific_status: source
    source_basis: ["tempo / beat tracking"]
    normalization_method: 1 - min BPM distance (incl. half/double time) / range
    missing_data_policy: neutral 0.5 + warning if BPM unknown
    validation_required: DJ pair ratings
    cannot_claim: tempo fit guarantees a beatmatch will work

  vocal:
    formula_symbol: S_vocal
    name: vocal compatibility
    scientific_status: candidate
    source_basis: ["pairwise vocal density proxy"]
    normalization_method: 1 - min(mean vocal density_a, mean vocal density_b)
    missing_data_policy: neutral 0.5 + warning if vocal proxy missing on either track
    validation_required: vocal annotations + DJ pair ratings
    cannot_claim: vocal compatibility proves no clash without vocal detection

  tension:
    formula_symbol: S_tension
    name: tension compatibility
    scientific_status: candidate
    source_basis: ["candidate tension proxy", "candidate release proxy"]
    normalization_method: window-level tension continuity + release handoff
    missing_data_policy: neutral 0.5 + warning if tension/release curves are unavailable
    validation_required: transition ratings across tension states
    cannot_claim: tension compatibility equals listener emotion

  harmonic:
    formula_symbol: S_harmonic
    name: harmonic compatibility
    scientific_status: source          # Camelot practice is source-backed rule-of-thumb
    source_basis: ["Mixed In Key Camelot wheel (S049)", "Serato Camelot notation (S050)"]
    normalization_method: relation score × key confidence (exact 1.0 … risky 0.15)
    missing_data_policy: neutral 0.5 + warning if key missing; damp toward 0.5 if low key confidence
    validation_required: DJ annotation of harmonic transitions (EXP024)
    cannot_claim: key match proves a good mix (C011) or predicts crowd reaction

  style:
    formula_symbol: S_style
    name: style fit
    scientific_status: hypothesis
    source_basis: ["genre-DNA inference (candidate)"]
    normalization_method: exact match 1.0, cross-style 0.5
    missing_data_policy: neutral 0.5 + warning if style labels missing
    validation_required: genre labels + DJ pair ratings
    cannot_claim: cross-style pairing is bad

  context:
    formula_symbol: C_fit
    name: context fit
    scientific_status: hypothesis      # hypothesis + candidate
    source_basis: ["performance-context inference"]
    normalization_method: role-conditioned heuristic track_context_score
    missing_data_policy: neutral 0.5 + warning if no context profile supplied
    validation_required: context-specific DJ ratings
    cannot_claim: context fit predicts crowd response

  # --- Set Builder components (transition_score, Set Builder v0.1) ---
  # harmonic + energy above are reused; these are the set-builder-only keys.
  bpm:
    formula_symbol: S_bpm
    name: set-flow tempo fit
    scientific_status: source
    source_basis: ["tempo / beat tracking (half/double-time folded)"]
    normalization_method: 1 - min BPM distance (incl. half/double time) / range
    missing_data_policy: neutral 0.5 + warning if BPM unknown on either track
    validation_required: DJ set-ordering ratings
    cannot_claim: tempo proximity guarantees an in-set beatmatch will land

  mixability:
    formula_symbol: S_mix
    name: pairwise mixability composite
    scientific_status: candidate
    source_basis: ["mixability model (harmonic + tempo + bass + vocal composite)"]
    normalization_method: reuse compute_mixability().mixability_score in [0,1]
    missing_data_policy: inherits the mixability model's per-component neutral/warn policy
    validation_required: DJ pair ratings
    cannot_claim: a high composite proves the pair mixes without pair validation

  # --- Sequence planner components (sequence_score, Phase 3 beam search) ---
  pair_score:
    formula_symbol: Q_pair
    name: per-step pair quality
    scientific_status: candidate
    source_basis: ["edge-decision core compatibility for the chosen step"]
    normalization_method: edge-decision core compatibility score in [0,1]
    missing_data_policy: inherits edge-decision neutral/warn policy
    validation_required: DJ transition ratings
    cannot_claim: a strong pair step proves the whole sequence works

  local_arc:
    formula_symbol: A_local
    name: local energy-arc fit
    scientific_status: hypothesis
    source_basis: ["target vs actual per-step energy delta"]
    normalization_method: 1 - |actual delta - target delta| / band
    missing_data_policy: neutral if energy normalization range is degenerate
    validation_required: DJ arc-shape annotations
    cannot_claim: local arc fit predicts crowd energy response

  global_arc:
    formula_symbol: A_global
    name: full-sequence arc fit
    scientific_status: hypothesis
    source_basis: ["mean abs error of the sequence energy vs target profile"]
    normalization_method: 1 - MAE / band
    missing_data_policy: neutral if energy normalization range is degenerate
    validation_required: DJ full-set arc annotations
    cannot_claim: global arc fit predicts a successful live set

  lookahead_arc:
    formula_symbol: A_look
    name: future-headroom preservation
    scientific_status: hypothesis
    source_basis: ["projected fit of remaining candidates after this step"]
    normalization_method: mean projected future-step fit in [0,1]
    missing_data_policy: neutral 0.5 when no lookahead candidates remain
    validation_required: DJ set-planning annotations
    cannot_claim: preserved headroom guarantees a better continuation exists

  terminal_arc:
    formula_symbol: A_term
    name: terminal-state fit
    scientific_status: hypothesis
    source_basis: ["fit of the branch endpoint to the target terminal energy"]
    normalization_method: terminal fit in [0,1]
    missing_data_policy: neutral 0.5 when the branch has no terminal estimate
    validation_required: DJ closing-energy annotations
    cannot_claim: terminal fit predicts how a set actually ends live

  set_memory:
    formula_symbol: M_set
    name: bounded set-memory fit
    scientific_status: hypothesis
    source_basis: ["recent role + tension progression over a bounded history window"]
    normalization_method: role-stage + tension progression fit in [0,1]
    missing_data_policy: neutral 0.5 when history is empty
    validation_required: DJ annotations of role/tension progression
    cannot_claim: memory fit models real listener fatigue or narrative

  transition_quality:
    formula_symbol: Q_trans
    name: transition-window quality
    scientific_status: candidate
    source_basis: ["best detected transition-window risk for the step edge"]
    normalization_method: 1 - transition-window risk in [0,1]
    missing_data_policy: neutral when no transition windows are detectable
    validation_required: DJ transition-window ratings
    cannot_claim: window quality proves a clean blend without DJ validation

  risk_penalty:
    formula_symbol: R_seq
    name: cumulative sequence risk penalty
    scientific_status: candidate
    source_basis: ["combined harmonic / bass / vocal edge risk for the step"]
    normalization_method: mean available edge risk in [0,1], subtracted from reward
    missing_data_policy: no penalty applied when risk components are unavailable
    validation_required: DJ review of flagged high-risk transitions
    cannot_claim: a low penalty proves the transition is safe without validation

  # --- Novelty penalties (§14 — soft, inside gate-passing candidates only) ---
  repeat_edge_penalty:
    formula_symbol: P_edge
    name: repeated transition penalty
    scientific_status: hypothesis
    source_basis: ["playlist history fingerprints (edge hashes)"]
    normalization_method: fixed subtraction per novelty mode (0.03-0.15)
    missing_data_policy: no history -> no penalty
    validation_required: DJ preference study on set-to-set variation
    cannot_claim: avoiding a repeated edge improves the set musically

  overuse_penalty:
    formula_symbol: P_overuse
    name: track overuse penalty
    scientific_status: hypothesis
    source_basis: ["track appearance counts across recent playlists"]
    normalization_method: fixed subtraction when appearances exceed carryover allowance
    missing_data_policy: no history -> no penalty; pinned/Must Have tracks exempt
    validation_required: DJ carryover-habit study
    cannot_claim: track rotation preferences generalize across DJs
