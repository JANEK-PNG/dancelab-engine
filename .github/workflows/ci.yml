name: DanceLab quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dancelab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.profile }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            profile: headless
            extras: "--extra rekordbox"
          - python-version: "3.12"
            profile: audio
            extras: "--extra audio --extra rekordbox"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python-version }}
      - run: >-
          uv sync --locked --extra dev ${{ matrix.extras }}
          --python ${{ matrix.python-version }}
      - run: >-
          uv run --locked ruff check src tests
          scripts/verify_clean_install.py scripts/docstring_coverage.py
      - run: uv run --locked pytest
      # Documentation is code: docstring coverage is ratcheted, not aspirational.
      # Floors live in scripts/docstring_coverage.py; see docs/DOCUMENTATION_STANDARD.md.
      - run: uv run --locked python scripts/docstring_coverage.py --check

  security:
    name: Security regressions and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: >-
          uv sync --locked --extra dev --extra audio --extra rekordbox
          --python 3.12
      - name: Run security regression tests
        run: >-
          uv run --locked pytest
          tests/test_security_regressions.py
          tests/test_api.py
          tests/test_cache_manager.py
          tests/test_rb_backup.py
          tests/test_rekordbox_cue_writer.py
          tests/test_rekordbox_device.py
          tests/test_tempo_validation.py
      - run: uv run --locked bandit -q -r src/dancelab -ll -ii
      - name: Export locked third-party dependencies
        run: >-
          uv export --locked --extra dev --extra audio --extra rekordbox
          --no-hashes --no-emit-project
          --format requirements.txt
          --output-file /tmp/dancelab-locked-requirements.txt
      - name: Audit locked third-party dependencies
        run: >-
          uv run --locked pip-audit --strict --no-deps --disable-pip
          --requirement /tmp/dancelab-locked-requirements.txt

  package:
    name: Wheel and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv build --wheel
      - run: uv run --locked python scripts/verify_clean_install.py dist/*.whl
      - run: >-
          uv run --locked python scripts/verify_clean_install.py
          --extra rekordbox dist/*.whl
